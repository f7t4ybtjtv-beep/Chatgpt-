[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-identifier"
version = "0.1.0"
description = "Open-source OSINT toolkit with an AI layer to identify and risk-assess who is contacting you."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "contact-identifier contributors" }]
keywords = ["osint", "security", "anti-fraud", "phishing", "scam-detection", "identity"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Intended Audience :: End Users/Desktop",
]
dependencies = []

[project.optional-dependencies]
# Offline metadata / network detectors
full = ["phonenumbers>=8.13", "dnspython>=2.4", "requests>=2.31", "python-whois>=0.9"]
# AI write-up backends (either one)
llm = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=7.4"]

[project.scripts]
contact-id = "contact_identifier.cli:main"

[project.urls]
Homepage = "https://github.com/f7t4ybtjtv-beep/Chatgpt-"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
